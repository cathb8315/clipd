name: CI

# Runs on every push to main and on every pull request, so a change is
# verified on a clean machine rather than only on the laptop that wrote it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Both platforms, because clipd's code is genuinely split by build tag:
    # the pbcopy backend and the whole launchagent package are darwin-only and
    # do not even compile into a Linux build. Testing on Linux alone would
    # leave the macOS half unverified; testing on macOS alone would not prove
    # the client still builds for the machine it actually runs on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than pinning it here, so there
          # is one place to bump it.
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -s -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The client is expected to run on Linux even when built from a Mac, so
      # the cross-target vet runs everywhere rather than only on Linux.
      - name: Vet (linux target)
        run: GOOS=linux GOARCH=amd64 go vet ./...

      # -race is the point of running tests in CI at all for this project: the
      # daemon is concurrent, and a data race is exactly the class of bug that
      # passes locally and fails in production.
      - name: Test
        run: go test -race ./...

  cross-compile:
    # A separate job so a broken build for one target is reported as its own
    # failure rather than hiding behind the test results.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build every release target
        run: make dist

      - name: Confirm the Linux binaries are static
        # CGO_ENABLED=0 is what lets a binary built here run on any Debian
        # without matching libc versions. If that ever regresses, the download
        # would fail at the user's machine rather than here.
        run: |
          for f in dist/clipd_linux_*; do
            if ! file "$f" | grep -q "statically linked"; then
              echo "$f is dynamically linked"; file "$f"; exit 1
            fi
            echo "ok: $f"
          done
